<!DOCTYPE html>
<html lang="en" data-asset-base="../assets/" data-path-depth="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course hub | Applied AI Programme Hub</title>
  <meta name="description" content="Official LTU course hub with syllabus, examination, literature, schedule, and public profile links.">
  <link rel="canonical" href="https://ahatha.github.io/applied-ai-learning-hub/courses/course.html">
  <meta name="theme-color" content="#0f6b63">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("aailh-theme");
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <noscript>
    <div class="noscript-banner">JavaScript is required to load the shared course hub from JSON data.</div>
  </noscript>
  <header class="site-header">
    <div class="container site-header__inner site-header__inner--simple">
      <a class="brand" href="../index.html">
        <span class="brand__mark" aria-hidden="true">AI</span>
        <span class="brand__text">Applied AI Programme Hub<small>LTU Applied AI · 2026–2028</small></span>
      </a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle colour theme">◐</button>
    </div>
  </header>

  <main id="main" class="site-main">
    <div class="container" id="course-hub">
      <div class="empty-state"><p>Loading course hub…</p></div>
    </div>
  </main>

  <footer class="site-footer site-footer--compact">
    <div class="container">
      <p>Personal learning hub for the LTU Master Programme in Applied AI. Not an official website of Luleå University of Technology.</p>
      <p class="site-footer__links">
        <a href="../academic-calendar.html">Academic calendar</a>
        <a href="https://github.com/ahatha/applied-ai-learning-hub" rel="noopener noreferrer" target="_blank">GitHub repository</a>
        <a href="https://www.ltu.se/en/education/programme/tmdia-master-programme-in-applied-ai" rel="noopener noreferrer" target="_blank">Official LTU programme page</a>
      </p>
    </div>
  </footer>

  <script src="../assets/js/theme.js" defer></script>
  <script src="../assets/js/data-loader.js" defer></script>
  <script src="../assets/js/course-hub.js" defer></script>
</body>
</html>
